name: Wdrożenie na GitHub Pages

# Publikacja ręczna (Actions → „Wdrożenie na GitHub Pages” → Run workflow), gdy Pages jest włączone w ustawieniach repo
# (Settings → Pages → Source: GitHub Actions). Przy każdym pushu testy uruchamia ci.yml — ten workflow nie zapala
# czerwonego krzyżyka, dopóki Pages nie jest włączone. Uwaga: most Jarvis OS dopuszcza origin github.io tylko w CORS;
# token oddaje wyłącznie originom lokalnym (/bridge/pair), więc na Pages trzeba go wkleić raz ręcznie — bez tego wersja
# z Pages działa bez Hermesa Desktop.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sprawdzenie składni JS
        run: for f in js/*.js sw.js; do node --check "$f"; done
      # Strona nie wychodzi na świat, jeśli testy nie przechodzą.
      - name: Testy jednostkowe
        run: node --test "tests/unit/*.test.js"
      # Publikujemy tylko pliki potrzebne aplikacji (bez testów, dokumentacji i konfiguracji repozytorium).
      - name: Przygotowanie paczki
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js assets _site/
          printf '/* brak lokalnej konfiguracji na GitHub Pages */\n' > _site/config.local.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
