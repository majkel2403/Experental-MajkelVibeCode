name: Import Jarvis experiments (one-time)
on:
  push:
    paths:
      - .github/workflows/import-jarvis-experiments.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import six immutable Git trees
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/majkel2403/Jarvis-.git '+refs/heads/*:refs/remotes/jarvis-import/*'
          entries=(
            'claude/stark-hud|jarvis-stark-hud|b5f760b08fca1874010d384128503f95118f737e'
            'claude/neon-hub|jarvis-neon-hub|7b01d2501cac62a1375c34162ead0030dba75419'
            'experiment/orb-lab|jarvis-orb-lab|76c0440d823a633dc45eef6f0f6e5fb97bd84c1c'
            'docs/cinematic-engine-spec|jarvis-cinematic-engine-spec|1836aeea25a6f67215104967e7425df88456ab90'
            'feat/jarvis-graph-3d|jarvis-graph-3d|d144300d9b583d78c87eed6c4f227b7624bb4d1f'
            'experiment/quantum-tree-ai-standalone|quantum-tree-ai-standalone|77cd7ad9898ee3e5fcf87775a4ee648453ce519a'
          )
          for item in "${entries[@]}"; do
            IFS='|' read -r branch folder expected <<< "$item"
            actual=$(git rev-parse "refs/remotes/jarvis-import/$branch")
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Branch $branch moved: expected $expected, got $actual"
              exit 1
            fi
            if git ls-tree HEAD "$folder" | grep -q .; then
              echo "::error::Destination folder $folder already exists"
              exit 1
            fi
            src_tree=$(git rev-parse "$actual^{tree}")
            git read-tree --prefix="$folder/" "$src_tree"
            staged_tree=$(git write-tree)
            dst_tree=$(git ls-tree "$staged_tree" "$folder" | awk '{print $3}')
            if [[ "$src_tree" != "$dst_tree" ]]; then
              echo "::error::Tree mismatch for $folder"
              exit 1
            fi
            echo "$folder $branch $actual $src_tree" | tee -a "$RUNNER_TEMP/migration-manifest.txt"
          done
          changed=$(git diff --cached --name-only | wc -l)
          echo "Staged $changed files"
          git commit -m "feat(experiments): preserve six complete Jarvis branch snapshots"
          git push origin HEAD:main
