[pytest]
# Testy Pythona: python -m pytest   (CI: -m unit). Testy na żywym moście: python bridge/tests/run_e2e.py
testpaths = bridge/tests/test_scripts.py hermes/tests
markers =
    unit: bez sieci i bez venv Hermesa (uruchamiane w CI)
    integration: startują własny, odizolowany most (wymagają mcp/uvicorn z venv Hermesa)
addopts = -p no:cacheprovider
